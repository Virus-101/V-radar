name: verify

# Runs the full verification suite on every push and PR. If this is green, the
# "verified" column in BRAINSHEET.md section 7 is true.
#
# No hardware and no network access required - every test is self-contained
# (synthesised data, real algorithms). The simulation matrix is skipped here
# because it needs Chrome; run it locally with `bash run_all_tests.sh`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          # pytest is needed for the integrated system tests
          python -m pip install pytest

      - name: ADS-B decoder
        working-directory: adsb
        run: python decoder.py

      - name: MLAT solver
        working-directory: adsb
        run: python mlat.py --demo

      - name: Position fusion
        working-directory: adsb
        run: python position_fusion.py

      - name: GPSDO clock monitor
        working-directory: adsb
        run: python pps_monitor.py --demo

      - name: ADS-B receiver / tracker
        working-directory: adsb
        run: python receiver.py

      - name: Wingbeat classifier
        working-directory: detection
        run: python wingbeat.py

      - name: Insect radar trigger
        working-directory: system
        run: python radar_trigger.py

      - name: Integrated system tests
        working-directory: system
        run: python -m pytest test_system.py -q

      - name: Python syntax across the tree
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = n = 0
          for f in pathlib.Path(".").rglob("*.py"):
              if "__pycache__" in str(f):
                  continue
              n += 1
              try:
                  ast.parse(f.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  bad += 1
                  print(f"SYNTAX ERROR: {f}: {e}")
          print(f"{n} files, {bad} errors")
          sys.exit(1 if bad else 0)
          PY
